# Hub fleet-validator via ACM ConfigurationPolicy (local-cluster only).
# Includes: Namespace, ServiceAccount, read-only RBAC, config, Deployment (+ oauth-proxy), Service,
#           Route, ServiceMonitor (UWM), the MCO user-workload metrics allowlist, the Thanos
#           querier binding, and the two Grafana dashboards (folder "Fleet-validator").
#
# UI access: Route -> oauth-proxy (OpenShift login) -> checklist UI/API on 127.0.0.1:8091.
# Only users who can list ManagedClusters get through (the UI shows fleet-wide state).
#
# Rendered by hack/render-acm-policy.sh from deploy/acm/policy-hub-fleet-validator.tmpl.yaml.
# Edit the template, not the rendered file.
#
# Namespace: open-cluster-management-global-set, whose ManagedClusterSetBinding for the
# "global" set ACM creates by default, so the Placement works on any hub without extra setup.
#
# Prereqs on the hub:
#   - User Workload Monitoring enabled (cluster-monitoring-config: enableUserWorkload: true)
#   - MCO observability addon running on local-cluster (for the Grafana dashboards)
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: hub-fleet-validator
  namespace: open-cluster-management-global-set
  annotations:
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/description: "Deploys fleet-validator on the ACM Hub: RBAC, Deployment, Service, Route, ServiceMonitor, MCO allowlist, Grafana dashboards."
spec:
  remediationAction: enforce
  # Keep Argo CD tracking labels/annotations off the replicated policies.
  copyPolicyMetadata: false
  disabled: false
  policy-templates:
    # A) Workload
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: hub-fleet-validator-config
        spec:
          remediationAction: enforce
          severity: medium
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            # 1) Namespace
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: fleet-validator
                  labels:
                    app: fleet-validator

            # 2) ServiceAccount (also the OAuth client of the Route)
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: fleet-validator
                  namespace: fleet-validator
                  labels:
                    app: fleet-validator
                  annotations:
                    serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"fleet-validator"}}'

            # 3) ClusterRole — read-only, only what the checks look at
            - complianceType: mustonlyhave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRole
                metadata:
                  name: fleet-validator-reader
                  labels:
                    app: fleet-validator
                rules:
                  - apiGroups: ["cluster.open-cluster-management.io"]
                    resources: ["managedclusters", "backupschedules", "placementdecisions"]
                    verbs: ["get", "list", "watch"]
                  - apiGroups: ["addon.open-cluster-management.io"]
                    resources: ["managedclusteraddons"]
                    verbs: ["get", "list", "watch"]
                  - apiGroups: ["internal.open-cluster-management.io"]
                    resources: ["managedclusterinfos"]
                    verbs: ["get", "list", "watch"]
                  - apiGroups: ["policy.open-cluster-management.io"]
                    resources: ["policies"]
                    verbs: ["get", "list", "watch"]
                  - apiGroups: ["operator.open-cluster-management.io"]
                    resources: ["multiclusterhubs"]
                    verbs: ["get", "list", "watch"]
                  - apiGroups: ["multicluster.openshift.io"]
                    resources: ["multiclusterengines"]
                    verbs: ["get", "list", "watch"]
                  - apiGroups: ["observability.open-cluster-management.io"]
                    resources: ["multiclusterobservabilities"]
                    verbs: ["get", "list", "watch"]
                  - apiGroups: ["apps.open-cluster-management.io"]
                    resources: ["gitopsclusters"]
                    verbs: ["get", "list", "watch"]
                  - apiGroups: ["operators.coreos.com"]
                    resources: ["clusterserviceversions"]
                    verbs: ["get", "list", "watch"]
                  - apiGroups: ["velero.io"]
                    resources: ["backupstoragelocations", "backups"]
                    verbs: ["get", "list", "watch"]
                  - apiGroups: ["argoproj.io"]
                    resources: ["applications", "argocds"]
                    verbs: ["get", "list", "watch"]
                  - apiGroups: ["config.openshift.io"]
                    resources: ["clusterversions", "clusteroperators"]
                    verbs: ["get", "list", "watch"]
                  - apiGroups: ["machineconfiguration.openshift.io"]
                    resources: ["machineconfigpools"]
                    verbs: ["get", "list", "watch"]
                  - apiGroups: ["operator.openshift.io"]
                    resources: ["etcds"]
                    verbs: ["get", "list", "watch"]
                  - apiGroups: ["certificates.k8s.io"]
                    resources: ["certificatesigningrequests"]
                    verbs: ["get", "list", "watch"]
                  - apiGroups: ["coordination.k8s.io"]
                    resources: ["leases"]
                    verbs: ["get", "list", "watch"]
                  - apiGroups: [""]
                    resources: ["nodes", "pods", "namespaces"]
                    verbs: ["get", "list", "watch"]
                  - apiGroups: [""]
                    resources: ["configmaps"]
                    resourceNames: ["cluster-monitoring-config"]
                    verbs: ["get"]

            # 4) ClusterRoleBinding
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  name: fleet-validator-reader
                  labels:
                    app: fleet-validator
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: fleet-validator-reader
                subjects:
                  - kind: ServiceAccount
                    name: fleet-validator
                    namespace: fleet-validator

            # 5) Config — thresholds and governance minimums (see README "Configuration").
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: fleet-validator-config
                  namespace: fleet-validator
                  labels:
                    app: fleet-validator
                data:
                  config.yaml: |
                    interval: 1m
                    concurrency: 4
                    requiredAddons:
                      - work-manager
                      - governance-policy-framework
                      - config-policy-controller
                    governance:
                      default:
                        minOperatorPolicies: 1
                        minConfigurationPolicies: 1
                      clusters: {}
                    thresholds:
                      apiP99Seconds: 1
                      etcdDBWarnBytes: 1073741824
                      etcdDBFailBytes: 6442450944
                      leaseStaleSeconds: 300
                      csrPendingGraceMinutes: 15
                      backupMaxAgeHours: 26
                    disabledChecks: []

            # 5b) Service CA bundle, to trust the in-cluster Thanos querier.
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: fleet-validator-service-ca
                  namespace: fleet-validator
                  labels:
                    app: fleet-validator
                  annotations:
                    service.beta.openshift.io/inject-cabundle: "true"

            # 6) Deployment
            - complianceType: musthave
              objectDefinition:
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: fleet-validator
                  namespace: fleet-validator
                  labels:
                    app: fleet-validator
                spec:
                  replicas: 1
                  selector:
                    matchLabels:
                      app: fleet-validator
                  template:
                    metadata:
                      labels:
                        app: fleet-validator
                    spec:
                      serviceAccountName: fleet-validator
                      securityContext:
                        runAsNonRoot: true
                        seccompProfile:
                          type: RuntimeDefault
                      containers:
                        - name: validator
                          image: __IMAGE__
                          imagePullPolicy: IfNotPresent
                          args:
                            - --config=/etc/fleet-validator/config.yaml
                            - --http-bind-address=:8090
                            - --ui-bind-address=127.0.0.1:8091
                            - --prometheus-ca=/etc/pki/fleet-validator/service-ca/service-ca.crt
                          ports:
                            - name: http
                              containerPort: 8090
                              protocol: TCP
                          readinessProbe:
                            httpGet:
                              path: /readyz
                              port: http
                            initialDelaySeconds: 5
                            periodSeconds: 10
                          livenessProbe:
                            httpGet:
                              path: /healthz
                              port: http
                            initialDelaySeconds: 15
                            periodSeconds: 20
                          volumeMounts:
                            - name: config
                              mountPath: /etc/fleet-validator
                              readOnly: true
                            - name: service-ca
                              mountPath: /etc/pki/fleet-validator/service-ca
                              readOnly: true
                          securityContext:
                            readOnlyRootFilesystem: true
                            allowPrivilegeEscalation: false
                            capabilities:
                              drop: ["ALL"]
                          resources:
                            requests:
                              cpu: 20m
                              memory: 64Mi
                            limits:
                              cpu: 500m
                              memory: 256Mi
                        # No `lookup` of the openshift/oauth-proxy ImageStreamTag here: the policy controller
                        # watches looked-up resources and ImageStreamTags cannot be watched, which stalls evaluation.
                        - name: oauth-proxy
                          image: registry.redhat.io/openshift4/ose-oauth-proxy-rhel9:v4.20
                          imagePullPolicy: IfNotPresent
                          args:
                            - --provider=openshift
                            - --https-address=:8443
                            - --http-address=
                            - --upstream=http://127.0.0.1:8091
                            - --openshift-service-account=fleet-validator
                            - --tls-cert=/etc/tls/private/tls.crt
                            - --tls-key=/etc/tls/private/tls.key
                            # HMAC key for session cookies; the service-ca private key is per-cluster and
                            # only readable by those who can read secrets in fleet-validator.
                            - --cookie-secret-file=/etc/tls/private/tls.key
                            - --cookie-secure=true
                            - '--openshift-sar={"group":"cluster.open-cluster-management.io","resource":"managedclusters","verb":"list"}'
                          ports:
                            - name: https
                              containerPort: 8443
                              protocol: TCP
                          readinessProbe:
                            httpGet:
                              path: /oauth/healthz
                              port: https
                              scheme: HTTPS
                            initialDelaySeconds: 5
                            periodSeconds: 10
                          livenessProbe:
                            httpGet:
                              path: /oauth/healthz
                              port: https
                              scheme: HTTPS
                            initialDelaySeconds: 15
                            periodSeconds: 20
                          securityContext:
                            allowPrivilegeEscalation: false
                            capabilities:
                              drop: ["ALL"]
                          volumeMounts:
                            - name: proxy-tls
                              mountPath: /etc/tls/private
                              readOnly: true
                          resources:
                            requests:
                              cpu: 10m
                              memory: 32Mi
                            limits:
                              memory: 128Mi
                      volumes:
                        - name: config
                          configMap:
                            name: fleet-validator-config
                        - name: service-ca
                          configMap:
                            name: fleet-validator-service-ca
                            optional: true
                        - name: proxy-tls
                          secret:
                            secretName: fleet-validator-tls

            # 7) Service — metrics on http (in-cluster only), UI/API via oauth-proxy on https.
            #    service-ca issues the fleet-validator-tls serving cert used by the proxy and trusted by the router.
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Service
                metadata:
                  name: fleet-validator
                  namespace: fleet-validator
                  labels:
                    app: fleet-validator
                  annotations:
                    service.beta.openshift.io/serving-cert-secret-name: fleet-validator-tls
                spec:
                  selector:
                    app: fleet-validator
                  ports:
                    - name: http
                      port: 8090
                      targetPort: http
                      protocol: TCP
                    - name: https
                      port: 8443
                      targetPort: https
                      protocol: TCP

            # 7b) Route — OpenShift login in front of the checklist UI/API
            - complianceType: musthave
              objectDefinition:
                apiVersion: route.openshift.io/v1
                kind: Route
                metadata:
                  name: fleet-validator
                  namespace: fleet-validator
                  labels:
                    app: fleet-validator
                spec:
                  to:
                    kind: Service
                    name: fleet-validator
                    weight: 100
                  port:
                    targetPort: https
                  tls:
                    termination: reencrypt
                    insecureEdgeTerminationPolicy: Redirect
                  wildcardPolicy: None

            # 8) ServiceMonitor (User Workload Monitoring)
            - complianceType: musthave
              objectDefinition:
                apiVersion: monitoring.coreos.com/v1
                kind: ServiceMonitor
                metadata:
                  name: fleet-validator
                  namespace: fleet-validator
                  labels:
                    app: fleet-validator
                spec:
                  selector:
                    matchLabels:
                      app: fleet-validator
                  endpoints:
                    - port: http
                      path: /metrics
                      interval: 60s
                      honorLabels: true

            # 9) MCO allowlist — metrics-collector only forwards allowlisted UWM series to the hub Thanos.
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: observability-metrics-custom-allowlist
                  namespace: fleet-validator
                  labels:
                    app: fleet-validator
                data:
                  uwl_metrics_list.yaml: |
                    names:
__ALLOWLIST__

    # B) Thanos querier access (etcd DB size, API latency). Kept separate: if the policy
    #    controller may not bind cluster-monitoring-view, only this template goes NonCompliant
    #    and those two checks report "skip".
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: hub-fleet-validator-monitoring
        spec:
          remediationAction: enforce
          severity: low
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  name: fleet-validator-cluster-monitoring-view
                  labels:
                    app: fleet-validator
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: cluster-monitoring-view
                subjects:
                  - kind: ServiceAccount
                    name: fleet-validator
                    namespace: fleet-validator

    # C) MCO Grafana dashboards — picked up by the grafana-dashboard-loader via the label.
    #    Templates are disabled here: the dashboards' Grafana legends use {{...}}, which the
    #    policy template engine would otherwise try to resolve.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: hub-fleet-validator-dashboards
          annotations:
            policy.open-cluster-management.io/disable-templates: "true"
        spec:
          remediationAction: enforce
          severity: low
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: acm-hub-validation-dashboard
                  namespace: open-cluster-management-observability
                  labels:
                    grafana-custom-dashboard: "true"
                  annotations:
                    observability.open-cluster-management.io/dashboard-folder: Fleet-validator
                data:
                  acm-hub-validation-dashboard.json: |-
__DASHBOARD_HUB__
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: managed-cluster-validation-dashboard
                  namespace: open-cluster-management-observability
                  labels:
                    grafana-custom-dashboard: "true"
                  annotations:
                    observability.open-cluster-management.io/dashboard-folder: Fleet-validator
                data:
                  managed-cluster-validation-dashboard.json: |-
__DASHBOARD_MANAGED__
