                            "uid": "${datasource}"
                          },
                          "gridPos": {
                            "h": 8,
                            "w": 4,
                            "x": 0,
                            "y": 1
                          },
                          "targets": [
                            {
                              "datasource": {
                                "type": "prometheus",
                                "uid": "${datasource}"
                              },
                              "expr": "max(fleetvalidator_cluster_score{managed_cluster=\"$managed_cluster\", cluster_type=\"managed\"})",
                              "refId": "A",
                              "legendFormat": "",
                              "instant": true,
                              "range": false,
                              "format": "time_series"
                            }
                          ],
                          "fieldConfig": {
                            "defaults": {
                              "unit": "none",
                              "min": 0,
                              "max": 100,
                              "decimals": 1,
                              "thresholds": {
                                "mode": "absolute",
                                "steps": [
                                  {
                                    "color": "red",
                                    "value": null
                                  },
                                  {
                                    "color": "orange",
                                    "value": 70
                                  },
                                  {
                                    "color": "green",
                                    "value": 90
                                  }
                                ]
                              },
                              "color": {
                                "mode": "thresholds"
                              }
                            },
                            "overrides": []
                          },
                          "options": {
                            "reduceOptions": {
                              "calcs": [
                                "lastNotNull"
                              ],
                              "fields": "",
                              "values": false
                            },
                            "showThresholdLabels": false,
                            "showThresholdMarkers": true
                          }
                        },
                        {
                          "id": 3,
                          "type": "stat",
                          "title": "Production ready",
                          "description": "READY when no critical check fails.",
