                          "type": "table",
                          "title": "Registration checks",
                          "description": "Hub-side view of the klusterlet: accepted, joined, available, import, clock, lease.",
                          "datasource": {
                            "type": "prometheus",
                            "uid": "${datasource}"
                          },
                          "gridPos": {
                            "h": 9,
                            "w": 24,
                            "x": 0,
                            "y": 18
                          },
                          "targets": [
                            {
                              "datasource": {
                                "type": "prometheus",
                                "uid": "${datasource}"
                              },
                              "expr": "max by (check, title, severity) (fleetvalidator_check_state{managed_cluster=\"$managed_cluster\", cluster_type=\"managed\", group=\"Registration\"})",
                              "refId": "A",
                              "legendFormat": "",
                              "instant": true,
                              "range": false,
                              "format": "table"
                            },
                            {
                              "datasource": {
                                "type": "prometheus",
                                "uid": "${datasource}"
                              },
                              "expr": "max by (check, detail) (fleetvalidator_check_detail{managed_cluster=\"$managed_cluster\", cluster_type=\"managed\", group=\"Registration\"})",
                              "refId": "B",
                              "legendFormat": "",
                              "instant": true,
                              "range": false,
                              "format": "table"
                            }
                          ],
                          "transformations": [
                            {
                              "id": "merge",
                              "options": {}
                            },
                            {
                              "id": "organize",
                              "options": {
                                "excludeByName": {
                                  "Time": true,
                                  "Value #B": true,
                                  "check": true
                                },
                                "indexByName": {
                                  "Value #A": 0,
                                  "title": 1,
                                  "severity": 2,
                                  "detail": 3
                                },
                                "renameByName": {
                                  "Value #A": "Result",
                                  "title": "Check",
                                  "severity": "Severity",
                                  "detail": "Detail"
                                }
                              }
                            }
                          ],
                          "fieldConfig": {
                            "defaults": {
                              "custom": {
                                "align": "left",
                                "filterable": false
                              }
                            },
                            "overrides": [
                              {
                                "matcher": {
                                  "id": "byName",
                                  "options": "Result"
                                },
                                "properties": [
                                  {
                                    "id": "mappings",
                                    "value": [
                                      {
                                        "type": "value",
                                        "options": {
                                          "1": {
                                            "text": "PASS",
                                            "color": "green",
                                            "index": 0
                                          },
                                          "0.5": {
                                            "text": "WARN",
                                            "color": "orange",
                                            "index": 1
                                          },
                                          "0": {
                                            "text": "FAIL",
                                            "color": "red",
                                            "index": 2
                                          },
                                          "-1": {
                                            "text": "SKIP",
                                            "color": "text",
                                            "index": 3
                                          }
                                        }
                                      }
                                    ]
                                  },
                                  {
                                    "id": "custom.width",
                                    "value": 90
                                  },
                                  {
                                    "id": "custom.align",
                                    "value": "center"
                                  },
                                  {
                                    "id": "custom.displayMode",
                                    "value": "color-background"
                                  },
                                  {
                                    "id": "custom.cellOptions",
                                    "value": {
                                      "type": "color-background"
                                    }
                                  }
                                ]
                              },
                              {
                                "matcher": {
                                  "id": "byName",
                                  "options": "Check"
                                },
                                "properties": [
                                  {
                                    "id": "custom.width",
                                    "value": 380
                                  }
                                ]
                              },
                              {
                                "matcher": {
                                  "id": "byName",
                                  "options": "Severity"
                                },
                                "properties": [
                                  {
                                    "id": "custom.width",
                                    "value": 100
                                  }
                                ]
                              }
                            ]
                          },
                          "options": {
                            "showHeader": true,
                            "cellHeight": "sm",
                            "sortBy": [
                              {
                                "displayName": "Result",
                                "desc": false
                              }
                            ]
                          }
                        },
