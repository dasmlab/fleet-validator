            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: managed-cluster-validation-dashboard
                  namespace: open-cluster-management-observability
                  labels:
                    grafana-custom-dashboard: "true"
                  annotations:
                    observability.open-cluster-management.io/dashboard-folder: Fleet-validator
                data:
                  managed-cluster-validation-dashboard.json: |-
                    {
                      "uid": "managed-cluster-validation-dashboard",
                      "title": "Managed Cluster Validation",
                      "description": "Production readiness checklist of one ACM managed cluster, from fleet-validator. Checks marked (probe) come from the fleet-validator-spoke-probes policy.",
                      "tags": [
                        "fleet-validator",
                        "acm",
                        "readiness"
                      ],
                      "timezone": "browser",
                      "editable": true,
                      "graphTooltip": 1,
                      "schemaVersion": 37,
                      "version": 1,
                      "refresh": "1m",
                      "time": {
                        "from": "now-24h",
                        "to": "now"
                      },
                      "annotations": {
                        "list": []
                      },
                      "links": [
                        {
                          "title": "Fleet validator",
                          "type": "dashboards",
                          "tags": [
                            "fleet-validator"
                          ],
                          "asDropdown": true,
                          "includeVars": false,
                          "keepTime": true
                        }
                      ],
                      "templating": {
                        "list": [
                          {
                            "name": "datasource",
                            "label": "Data source",
                            "type": "datasource",
                            "query": "prometheus",
                            "current": {
                              "selected": true,
                              "text": "Observatorium",
                              "value": "Observatorium"
                            },
                            "regex": "",
                            "refresh": 1,
                            "hide": 0,
                            "includeAll": false,
                            "multi": false
                          },
                          {
                            "name": "managed_cluster",
                            "label": "Managed cluster",
                            "type": "query",
                            "datasource": {
                              "type": "prometheus",
                              "uid": "${datasource}"
                            },
                            "definition": "label_values(fleetvalidator_cluster_score{cluster_type=\"managed\"}, managed_cluster)",
                            "query": {
                              "query": "label_values(fleetvalidator_cluster_score{cluster_type=\"managed\"}, managed_cluster)",
                              "refId": "PrometheusVariableQueryEditor-VariableQuery"
                            },
                            "refresh": 2,
                            "sort": 1,
                            "multi": false,
                            "includeAll": false,
                            "hide": 0
                          }
                        ]
                      },
                      "panels": [
                        {
                          "id": 1,
                          "type": "row",
                          "title": "Overview",
                          "collapsed": false,
                          "gridPos": {
                            "h": 1,
                            "w": 24,
                            "x": 0,
                            "y": 0
                          },
                          "panels": []
                        },
                        {
                          "id": 2,
