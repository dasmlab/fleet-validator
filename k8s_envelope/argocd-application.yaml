# Argo CD Application on 2026-prod-1: syncs the plain-manifest envelope CI publishes to
# lmcdasm/dasmlab-live-cicd clusters/2026-prod-1/fleet-validator/live. Same pattern as rf2vc.
# The ACM Policy bundle CI publishes next to it (../acm) is for ACM hubs and is not synced.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fleet-validator
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: fleet-validator
    dasmlab.org/cluster: 2026-prod-1
spec:
  project: default
  source:
    repoURL: git@github.com:lmcdasm/dasmlab-live-cicd.git
    targetRevision: main
    path: clusters/2026-prod-1/fleet-validator/live
    directory:
      recurse: false
      include: fleet-validator-v*.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: fleet-validator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
