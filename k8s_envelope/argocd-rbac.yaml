# Lets the openshift-gitops application controller manage the fleet-validator namespace
# (same as live-cicd clusters/2026-prod-1/argocd/bootstrap/rf2vc-rbac.yaml).
apiVersion: v1
kind: Namespace
metadata:
  name: fleet-validator
  labels:
    app: fleet-validator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openshift-gitops-argocd-application-controller
  namespace: fleet-validator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
---
# admin does not include ServiceMonitors on OpenShift.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openshift-gitops-argocd-application-controller-monitoring
  namespace: fleet-validator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: monitoring-edit
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
