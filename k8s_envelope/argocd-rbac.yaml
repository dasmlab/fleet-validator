# Lets the openshift-gitops application controller manage the fleet-validator policies.
# ACM Policies are the only thing Argo CD applies; the policy framework creates the rest.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleet-validator-gitops
  namespace: open-cluster-management-global-set
rules:
  - apiGroups: ["policy.open-cluster-management.io"]
    resources: ["policies", "placementbindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources: ["placements"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleet-validator-gitops
  namespace: open-cluster-management-global-set
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleet-validator-gitops
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
